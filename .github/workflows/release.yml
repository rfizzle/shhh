name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # A release is cut only from a commit whose CI run finished green. The job
  # matches runs of the workflow named "CI" (test.yml) by head sha, not by
  # branch, waits up to an hour for one to finish, and fails naming the run.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Wait for the commit's CI run
        run: |
          deadline=$((SECONDS + 3600))
          grace=$((SECONDS + 300))
          while true; do
            runs=$(gh run list -R "$REPO" --commit "$SHA" --workflow CI --limit 20 \
              --json status,conclusion,url,databaseId)
            total=$(jq length <<<"$runs")
            if [ "$total" -eq 0 ]; then
              if [ "$SECONDS" -ge "$grace" ]; then
                echo "::error::no CI run exists for commit $SHA; tag a commit that CI has run on"
                exit 1
              fi
            else
              if [ "$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<<"$runs")" -gt 0 ]; then
                echo "CI is green for $SHA"
                exit 0
              fi
              if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" -eq 0 ]; then
                jq -r '.[0] | "::error::CI did not pass for '"$SHA"': \(.conclusion) \(.url)"' <<<"$runs"
                exit 1
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              jq -r '.[0] | "::error::CI was still \(.status) after an hour for '"$SHA"': \(.url)"' <<<"$runs"
              exit 1
            fi
            sleep 60
          done

  # The image is built first because the binary carries its digest: the
  # digest exists only once the push has finished, and goreleaser links it in.
  # See docs/capabilities/containment.md#the-sandbox-image-ships-with-the-binary.
  image:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      # The image carries shhh as its command helper. The binary is built
      # here, before the image, and without the image's digest: the helper
      # never starts a container, so it never needs to know which one it is in.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the sandbox helper
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o docker/sandbox/bin/linux-$arch/shhh ./cmd/shhh
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shhh-sandbox:${{ github.ref_name }}

      # The multi-platform index's digest, so one pin serves both architectures.
      - id: ref
        run: echo "ref=ghcr.io/${{ github.repository_owner }}/shhh-sandbox@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  release:
    needs: [ci, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The shipped host-list snapshots are the floor under the download; a
      # release does not go out carrying one past its bound.
      - run: make host-lists-check

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHHH_SANDBOX_IMAGE: ${{ needs.image.outputs.ref }}
