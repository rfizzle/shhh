name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Install only, never run: `make ci` runs golangci-lint itself, so the
      # gate here is the same one a developer runs locally. golangci-lint-action
      # has no install-only mode — whatever it is given ends up appended to
      # `golangci-lint run` — so the install is spelled out instead.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `make ci` refuses to run its formatting gate without goimports rather
      # than skipping it, so the runner has to carry the binary: a skipped
      # check is green, and green is the one answer this gate must not give
      # when it has not looked. It is not in go.mod — nothing imports it — so
      # it is installed the way the lint binary above is.
      - name: Install goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # make ci ends by driving the built binary through the TUI smoke scene
      # in a tmux pane (scripts/tui/). The runner has python3; it does not
      # have tmux.
      - name: Install tmux
        run: sudo apt-get install -y tmux

      - run: make ci

  # These tests deliberately bind loopback listeners. They are a boundary
  # contract, not a contained-session check, so this job provides the host
  # capability explicitly instead of making the ordinary CI job depend on it.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make test-contract

  # The containment tests run the real mechanism and skip where there is
  # none, so a runner without bubblewrap reports a green suite that never put
  # the deny mask to the kernel. Installing the binary is not enough: Ubuntu
  # can restrict unprivileged user namespaces through AppArmor. The probe
  # makes that unavailable mechanism a red job rather than a suite of skips.
  containment-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --ro-bind / / true

      - run: make test-integration

  # Seatbelt is macOS's mechanism and lives at a fixed path, so nothing on a
  # Linux runner can stand in for it: the containment tests there skip it by
  # name. This job is the only place that claim is put to an actual kernel,
  # and it is the two packages that make it rather than the whole suite —
  # everything else is platform-independent and already ran above.
  containment-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same reason the Linux job runs the probe: a mechanism that is not
      # there is a skip, and a suite of skips is green.
      - run: test -x /usr/bin/sandbox-exec

      - run: make test-integration
