name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Install only, never run: `make ci` runs golangci-lint itself, so the
      # gate here is the same one a developer runs locally. golangci-lint-action
      # has no install-only mode — whatever it is given ends up appended to
      # `golangci-lint run` — so the install is spelled out instead.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `make ci` refuses to run its formatting gate without goimports rather
      # than skipping it, so the runner has to carry the binary: a skipped
      # check is green, and green is the one answer this gate must not give
      # when it has not looked. It is not in go.mod — nothing imports it — so
      # it is installed the way the lint binary above is.
      - name: Install goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # make ci ends by driving the built binary through every TUI scene in
      # a tmux pane (scripts/tui/). The runner has python3; it does not have
      # tmux.
      - name: Install tmux
        run: sudo apt-get install -y tmux

      # The fan-out scenes wait on a child's command card, and a writer's
      # command that nothing can contain is refused before its card is drawn
      # (docs/capabilities/containment.md#containment-can-be-required), so
      # those scenes need a containment mechanism on the runner. Installed and
      # proved the way the containment job below does it: the binary alone is
      # not a mechanism where AppArmor restricts unprivileged user namespaces,
      # and the probe makes that a red step here rather than four scenes that
      # wait out their snaps.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --ro-bind / / true

      - run: make ci

  # The sandbox image is built by the release, where a broken Dockerfile would
  # stop the tag; building it here, without pushing, moves that failure to the
  # change that caused it.
  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Both platforms the release ships, so the emulated one is timed here
      # rather than for the first time on a tag.
      - uses: docker/build-push-action@v6
        with:
          context: docker/sandbox
          platforms: linux/amd64,linux/arm64
          push: false

  # These tests deliberately bind loopback listeners. They are a boundary
  # contract, not a contained-session check, so this job provides the host
  # capability explicitly instead of making the ordinary CI job depend on it.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make test-contract

  # The containment tests run the real mechanism and skip where there is
  # none, so a runner without bubblewrap reports a green suite that never put
  # the deny mask to the kernel. Installing the binary is not enough: Ubuntu
  # can restrict unprivileged user namespaces through AppArmor. The probe
  # makes that unavailable mechanism a red job rather than a suite of skips.
  containment-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --ro-bind / / true

      - run: make test-integration

  # A sandbox session's cancel reaches its command through the engine's exec
  # stream, which only a real engine can show. The test names its engine and
  # image, so a runner without them would skip it; this job gives it docker,
  # which is the engine it has to pass on.
  sandbox-session-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test -mod=readonly -tags=integration -count=1 -v -run 'TestSandboxCancelStopsTheContainerGroup$' ./internal/cli
        env:
          SHHH_SANDBOX_IT_ENGINE: docker
          SHHH_SANDBOX_IT_IMAGE: alpine:3.20

  # Seatbelt is macOS's mechanism and lives at a fixed path, so nothing on a
  # Linux runner can stand in for it: the containment tests there skip it by
  # name. This job is the only place that claim is put to an actual kernel,
  # and it is the two packages that make it rather than the whole suite —
  # everything else is platform-independent and already ran above.
  containment-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same reason the Linux job runs the probe: a mechanism that is not
      # there is a skip, and a suite of skips is green.
      - run: test -x /usr/bin/sandbox-exec

      - run: make test-integration
