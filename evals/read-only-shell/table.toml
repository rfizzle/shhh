[[row]]
name = "measuring package sizes stays on the inspection list"
why = "the read-only paragraph prints the commands that run and the refusal repeats them; a measurement asked of a read-only session is answered with the listed commands or the readers, never a guessed make, go test, linter or pipe"
expect = ["listed"]
instruction = "Measure the size of each Go package in this module — how many files, lines of Go and bytes each holds — and say which is the largest."
files = { "go.mod" = "module example.com/sizes\n\ngo 1.22\n", "internal/store/store.go" = "package store\n\n// Store keeps values by key.\ntype Store struct {\n\tvalues map[string]string\n}\n\n// New makes an empty store.\nfunc New() *Store { return &Store{values: map[string]string{}} }\n\n// Get reads a value.\nfunc (s *Store) Get(k string) (string, bool) {\n\tv, ok := s.values[k]\n\treturn v, ok\n}\n\n// Put writes a value.\nfunc (s *Store) Put(k, v string) { s.values[k] = v }\n\n// Delete removes a value.\nfunc (s *Store) Delete(k string) { delete(s.values, k) }\n", "internal/store/keys.go" = "package store\n\nimport \"sort\"\n\n// Keys lists every key in order.\nfunc (s *Store) Keys() []string {\n\tkeys := make([]string, 0, len(s.values))\n\tfor k := range s.values {\n\t\tkeys = append(keys, k)\n\t}\n\tsort.Strings(keys)\n\treturn keys\n}\n", "internal/clock/clock.go" = "package clock\n\nimport \"time\"\n\n// Now is the clock the module reads.\nvar Now = time.Now\n", "cmd/sizes/main.go" = "package main\n\nimport (\n\t\"fmt\"\n\n\t\"example.com/sizes/internal/clock\"\n\t\"example.com/sizes/internal/store\"\n)\n\nfunc main() {\n\ts := store.New()\n\ts.Put(\"started\", clock.Now().String())\n\tfmt.Println(s.Keys())\n}\n" }
