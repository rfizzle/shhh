package gamma

import "sync"

var (
	mu   sync.Mutex
	jobs = map[int]string{}
	next int
)

// Start starts the job and returns its id.
func Start(name string) int {
	mu.Lock()
	defer mu.Unlock()
	next++
	jobs[next] = name
	return next
}

// Stop stops the job with the given id.
func Stop(id int) {
	mu.Lock()
	defer mu.Unlock()
	delete(jobs, id)
}

func Reset() {
	mu.Lock()
	defer mu.Unlock()
	jobs = map[int]string{}
	next = 0
}
