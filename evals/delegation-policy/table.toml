"pkg/gamma/limit.go" = '''
package gamma

var limit int

// Cap is the most jobs that may run at once.
func Cap() int {
	return limit
}

func SetCap(n int) {
	mu.Lock()
	defer mu.Unlock()
	limit = n
}

func Full() bool {
	mu.Lock()
	defer mu.Unlock()
	return limit > 0 && len(jobs) >= limit
}

// Free reports how many more jobs may start.
func Free() int {
	mu.Lock()
	defer mu.Unlock()
	if limit <= 0 {
		return -1
	}
	return limit - len(jobs)
}
