"pkg/gamma/query.go" = '''
package gamma

import "sort"

func Name(id int) string {
	mu.Lock()
	defer mu.Unlock()
	return jobs[id]
}

// Running reports how many jobs are running.
func Running() int {
	mu.Lock()
	defer mu.Unlock()
	return len(jobs)
}

func IDs() []int {
	mu.Lock()
	defer mu.Unlock()
	out := make([]int, 0, len(jobs))
	for id := range jobs {
		out = append(out, id)
	}
	sort.Ints(out)
	return out
}

// Find returns the id of the first job with the name.
func Find(name string) (int, bool) {
	for _, id := range IDs() {
		if Name(id) == name {
			return id, true
		}
	}
	return 0, false
}
