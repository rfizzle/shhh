	return strings.Count(s, "\n") + 1
}

func Words(s string) int {
	return len(strings.Fields(s))
}

// Bytes counts the bytes in s.
func Bytes(s string) int {
	return len(s)
}

func Longest(lines []string) string {
	best := ""
	for _, l := range lines {
		if len(l) > len(best) {
			best = l
		}
	}
	return best
}
