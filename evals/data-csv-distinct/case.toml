name = "data-csv-distinct"
prompt = "Which distinct values does the region column of data/sales.csv hold? Write them to answer.txt, one per line. Change nothing else."

# One question the shell answers with a data idiom (a CSV column's distinct values) and a built-in
# reader answers in one call without an approval. The check only says the
# answer is right; the report's shell calls, rounds and result bytes are
# what the case is read for.
requires = ["sh", "git"]

check = ["sh", "check.sh"]
