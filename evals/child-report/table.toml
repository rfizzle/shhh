  "the exporter writes a header row and one line per record",
]

[[row]]
name = "the last reading of a child's work reaches the parent"
why = "a fan-out is judged by readings nobody sees; a verdict that stayed on the lane is invisible to the model deciding what to do next"
expect = ["reported"]
role = "researcher"
task = "survey what the exporter writes"
reply = "the exporter writes a header row and one line per record"
state = "off_target"
