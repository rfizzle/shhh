<h1>Caching Alcedo tokens</h1>
<p>Posted 2019-03-02 on the Kingfisher engineering blog.</p>
<p>Alcedo caches an access token for 24 hours, so a service that refreshes on every call is doing work nobody asked for.</p>
<p>We cache ours for the same day and have never seen a stale token.</p>
