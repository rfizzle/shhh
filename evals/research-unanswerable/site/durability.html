<h1>Durability guarantees</h1>
<p>Published 2024-07-01.</p>
<p>Sparrow acknowledges a publish only after the message is on disk on two of the three replicas.</p>
<p>A broker that loses its disk recovers its log from the replicas when it restarts.</p>
