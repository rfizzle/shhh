<h1>Retries and backoff</h1>
<p>Published 2024-05-19.</p>
<p>Sparrow retries a delivery four times, doubling the wait between attempts from one second.</p>
<p>A message that has failed five times is moved to the parked queue and stays there until an operator releases it.</p>
