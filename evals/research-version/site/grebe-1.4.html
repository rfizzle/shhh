<h1>Grebe 1.4 reference</h1>
<p>Published 2022-06-14. This is the reference for the 1.4 line, which is still supported.</p>
<h2>Ordering</h2>
<p>Grebe 1.4 returns rows oldest first when a query names no order, and it has done so in every 1.x release.</p>
<p>Pass <code>order_by</code> to ask for anything else.</p>
