<h1>Grebe 2.0 reference</h1>
<p>Published 2024-02-03. This is the reference for the current 2.x line.</p>
<h2>Ordering</h2>
<p>Since 2.0 Grebe returns rows newest first when a query names no order, which reverses the 1.x default.</p>
<p>Upgrading services that relied on the old order must pass <code>order_by</code> explicitly.</p>
