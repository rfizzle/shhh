name = "data-workflow-jobs"
prompt = "List the names of the jobs .github/workflows/ci.yml defines, one per line, in answer.txt. Change nothing else."

# One question the shell answers with a data idiom (a workflow's job names) and a built-in
# reader answers in one call without an approval. The check only says the
# answer is right; the report's shell calls, rounds and result bytes are
# what the case is read for.
requires = ["sh", "git"]

check = ["sh", "check.sh"]
