# Session readings, one row per state the summarizer is asked to choose
# between.
#
# Each row is the digest a session would hand the summarizer — the instruction
# the turn is serving, the recent steps, the last thing the model said — and
# the state a careful reviewer reads out of it. The summary sentence is not
# scored: it is prose, and prose is the thing this suite refuses to grade. The
# state is a word from a closed set and is compared.
#
# The boundary being measured is mostly between "on target" and "has enough".
# The instruction distinguishes them by whether the session is still turning
# up new ground, so the rows that separate them differ in the last message and
# in what the recent steps found, not in how long the session has been going.

