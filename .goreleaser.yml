version: 2

before:
  hooks:
    - make third-party-licenses

builds:
  - id: shhh
    main: ./cmd/shhh
    binary: shhh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # The commit's own time, so the same tag builds the same bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/rfizzle/shhh/internal/cli.version={{.Version}} -X github.com/rfizzle/shhh/internal/cli.sandboxImage={{ envOrDefault "SHHH_SANDBOX_IMAGE" "" }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    # Windows has no tar in the shell most people extract with, and a .zip is
    # what its own Explorer opens without a second tool.
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - THIRD_PARTY_LICENSES

# A cask, not a formula: goreleaser retired `brews` (deprecated from v2.10,
# formally in v2.16). A cask installs the archive's binary by name and has no
# install or test block. It needs no quarantine hook: the darwin binaries are
# signed and notarized below, so Gatekeeper lets them run.
homebrew_casks:
  - repository:
      owner: rfizzle
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: shhh
    binaries:
      - shhh
    homepage: https://github.com/rfizzle/shhh
    description: Natural language to shell commands

# The darwin binaries are signed with the Developer ID certificate and
# notarized through the App Store Connect API, on this runner, with no macOS
# machine: Quill does both for a bare binary. Enabled only where the secrets
# are set, so a fork or a dry run without them still builds. The identity is
# five repository secrets: the base64 .p12 and its password, and the API
# key's issuer id, key id and .p8 contents.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - shhh
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # Waited for, so a refusal fails the release here and not on a
        # user's Mac. Apple usually answers in minutes; a team's first
        # submissions are the slow ones, and the bound is Apple's own
        # worst case. The wait runs on the Linux runner.
        wait: true
        timeout: 45m

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
