version: 2

builds:
  - main: ./cmd/shhh
    binary: shhh
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/rfizzle/shhh/internal/cli.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    # Windows has no tar in the shell most people extract with, and a .zip is
    # what its own Explorer opens without a second tool.
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - repository:
      owner: rfizzle
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: shhh
    homepage: https://github.com/rfizzle/shhh
    description: Natural language to shell commands
    license: MIT
    install: |
      bin.install "shhh"
    test: |
      system "#{bin}/shhh", "--version"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
